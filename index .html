<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ushizhimaの自己紹介</title>
  <style>
    /* 基本設定：画面幅に合わせてはみ出さないようにする */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff; /* 背景色：白 */
      color: #333333;            /* 基本の文字色（濃いグレー） */
      font-family: sans-serif;
      line-height: 1.7;
    }

    /* 全体の横幅制限と余白（広い画面でも狭い画面でも読みやすく） */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    /* ヘッダー（表示名とページ内メニュー） */
    header {
      border-bottom: 2px solid #eeeeee;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    header h1 {
      margin: 0 0 15px 0;
      font-size: 1.8rem;
      color: #222222;
    }

    /* ページ内メニュー */
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-wrap: wrap; /* 狭い画面で自動的に折り返す */
      gap: 15px;
    }

    nav a {
      text-decoration: none;
      color: #333333;
      background-color: #f5f5f5;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.95rem;
      display: inline-block;
    }

    nav a:hover {
      background-color: #e0e0e0;
    }

    /* 各セクションのスタイル */
    section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #eeeeee;
      border-radius: 8px;
      background-color: #ffffff;
    }

    section h2 {
      margin-top: 0;
      font-size: 1.3rem;
      border-left: 4px solid #333333;
      padding-left: 10px;
      color: #222222;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Ushizhima</h1>
      <nav aria-label="ページ内メニュー">
        <ul>
          <li><a href="#about">自己紹介</a></li>
          <li><a href="#learning">今学んでいること</a></li>
          <li><a href="#future">これからやってみたいこと</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="about">
        <h2>自己紹介</h2>
        <!-- ▼ 紹介文を変える場所（ここを書き換えてください） ▼ -->
        <p>
          はじめまして！Ushizhimaです。<br>
          大学一年生で、情報系の学科に所属しています。
        </p>
        <!-- ▲ 紹介文を変える場所 ここまで ▲ -->
      </section>

      <section id="learning">
        <h2>今学んでいること</h2>
        <p>
          プログラミングを学んでいます。
        </p>
      </section>

      <section id="future">
        <h2>これからやってみたいこと</h2>
        <p>
          いろいろな魔法のような新体験をしてみたいです。
        </p>
      </section>
    </main>
  </div>
</body>
</html>
